<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Lives — Centro de Mídias</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f11;
    --surface: #141618;
    --surface2: #1c1f22;
    --border: rgba(255,255,255,0.08);
    --accent: #1d9e75;
    --accent-dim: rgba(29,158,117,0.12);
    --accent-glow: rgba(29,158,117,0.22);
    --red: #e24b4a;
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --text: #e8e8e6;
    --text-muted: #6b6f72;
    --text-dim: #3a3d40;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:100; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px); }

  /* ── LOADING ── */
  #loading-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
  .loading-logo { display:flex; align-items:center; gap:12px; }
  .loading-logo-icon { width:40px; height:40px; border:1px solid var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .loading-logo-icon svg { width:20px; height:20px; fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; }
  .loading-title { font-family:var(--mono); font-size:15px; letter-spacing:0.04em; }
  .loading-sub { font-family:var(--mono); font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }
  .loading-bar { width:240px; height:2px; background:var(--surface2); border-radius:2px; overflow:hidden; }
  .loading-bar-fill { height:100%; width:0%; background:var(--accent); border-radius:2px; transition:width 0.5s ease; }
  .loading-msg { font-family:var(--mono); font-size:12px; color:var(--text-muted); letter-spacing:0.06em; animation:blink 1.2s infinite; }
  .loading-error { font-family:var(--mono); font-size:12px; color:var(--red); text-align:center; max-width:420px; line-height:1.8; display:none; padding:0 20px; }
  .btn-retry { margin-top:14px; background:transparent; border:1px solid var(--red); color:var(--red); font-family:var(--mono); font-size:11px; padding:7px 20px; border-radius:5px; cursor:pointer; }
  .btn-retry:hover { background:rgba(226,75,74,0.1); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* ── MONITOR ── */
  #monitor-screen { display:none; }

  header { display:flex; align-items:center; justify-content:space-between; padding:11px 22px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:50; flex-wrap:wrap; gap:8px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { width:30px; height:30px; border:1px solid var(--accent); border-radius:6px; display:flex; align-items:center; justify-content:center; }
  .logo-icon svg { width:15px; height:15px; fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; }
  .logo-text { font-family:var(--mono); font-size:13px; letter-spacing:.04em; }
  .logo-sub { font-size:10px; color:var(--text-muted); font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; }
  .header-right { display:flex; align-items:center; gap:8px; }
  .live-pill { display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--red); letter-spacing:.1em; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--red); animation:blink 1.4s infinite; }
  .clock { font-family:var(--mono); font-size:14px; color:var(--text-muted); letter-spacing:.05em; min-width:68px; }

  .btn-hdr { font-family:var(--mono); font-size:11px; background:transparent; border:1px solid var(--border); border-radius:4px; padding:5px 12px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px; white-space:nowrap; color:var(--text-dim); }
  .btn-hdr svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; flex-shrink:0; }
  .btn-hdr:hover:not(:disabled) { color:var(--accent); border-color:var(--accent); }
  .btn-hdr:disabled { opacity:0.35; cursor:not-allowed; }
  .btn-hdr.amber { border-color:rgba(245,158,11,0.4); color:var(--amber); }
  .btn-hdr.amber:hover:not(:disabled) { background:var(--amber-dim); border-color:var(--amber); }
  .btn-hdr.amber.ativo { background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }

  .turno-bar { display:flex; align-items:center; padding:10px 22px; border-bottom:1px solid var(--border); background:var(--surface); }
  .turno-label { font-family:var(--mono); font-size:10px; color:var(--text-muted); letter-spacing:.12em; text-transform:uppercase; margin-right:14px; }
  .t-tab { padding:5px 18px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-family:var(--mono); font-size:12px; cursor:pointer; transition:all .15s; letter-spacing:.04em; }
  .t-tab:first-of-type { border-radius:4px 0 0 4px; }
  .t-tab:last-of-type { border-radius:0 4px 4px 0; }
  .t-tab+.t-tab { border-left:none; }
  .t-tab.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent); position:relative; z-index:1; }

  .status-bar { display:flex; align-items:center; justify-content:space-between; padding:7px 22px; background:var(--surface2); border-bottom:1px solid var(--border); gap:10px; }
  .status-left { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--text-muted); min-width:0; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .status-right { font-family:var(--mono); font-size:10px; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }

  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; padding:14px 22px 22px; }
  @media(max-width:1300px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}

  .channel-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .25s, box-shadow .25s; }
  .channel-card.listening  { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow),0 0 20px var(--accent-glow); }
  .channel-card.listen-all { border-color:var(--amber);  box-shadow:0 0 0 1px rgba(245,158,11,.25),0 0 20px rgba(245,158,11,.12); }

  .player-wrapper { position:relative; width:100%; padding-top:56.25%; background:#000; overflow:hidden; }
  .player-wrapper iframe { position:absolute; inset:0; width:100%; height:100%; border:none; z-index:1; }
  .player-overlay { position:absolute; inset:0; background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,0.5) 100%); pointer-events:none; z-index:2; }

  .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:#080a0b; z-index:1; }
  .ph svg { width:26px; height:26px; fill:none; stroke:var(--text-dim); stroke-width:1.5; stroke-linecap:round; }
  .ph span { font-family:var(--mono); font-size:10px; color:var(--text-dim); letter-spacing:.06em; }
  .ph.loading svg { stroke:var(--accent); }
  .ph.loading span { color:var(--accent); animation:blink 1.1s infinite; }

  .badge { position:absolute; font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 8px; border-radius:3px; display:none; align-items:center; gap:5px; pointer-events:none; z-index:3; top:8px; left:8px; }
  .badge-live     { background:var(--red); color:#fff; }
  .badge-upcoming { background:var(--amber); color:#000; font-weight:500; }
  .badge-live .dot { width:5px; height:5px; border-radius:50%; background:#fff; animation:blink 1.4s infinite; }
  .badge-muted { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.7); color:var(--text-muted); font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:3px; pointer-events:none; z-index:3; transition:opacity .2s; }
  .channel-card.listening  .badge-muted,
  .channel-card.listen-all .badge-muted { opacity:0; }

  .card-info { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .card-title { font-size:14px; font-weight:500; }
  .card-shift { font-family:var(--mono); font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
  .card-vtitle { font-size:10px; color:var(--text-dim); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .vol-bar { display:flex; align-items:center; gap:6px; }
  .vol-label { font-family:var(--mono); font-size:9px; color:var(--text-dim); letter-spacing:.06em; width:20px; flex-shrink:0; }
  .vol-segs { display:flex; gap:2px; flex:1; }
  .vol-seg { flex:1; height:7px; border-radius:1px; background:var(--surface2); border:1px solid var(--text-dim); transition:all .25s; }
  .channel-card.listening  .vol-seg { border-color:var(--accent); }
  .channel-card.listen-all .vol-seg { border-color:var(--amber); }
  .channel-card.listening  .vol-seg.on { background:var(--accent); }
  .channel-card.listen-all .vol-seg.on { background:var(--amber); }

  .btn-listen { width:100%; padding:7px 0; border-radius:5px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-family:var(--mono); font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all .15s; letter-spacing:.04em; }
  .btn-listen:hover:not(:disabled) { background:var(--surface2); color:var(--text); }
  .btn-listen.s-active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:500; }
  .btn-listen.a-active { background:var(--amber-dim);  border-color:var(--amber);  color:var(--amber);  font-weight:500; }
  .btn-listen:disabled { opacity:.3; cursor:not-allowed; }
  .btn-listen svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  .yt-link { display:flex; align-items:center; justify-content:center; gap:4px; font-family:var(--mono); font-size:10px; color:var(--text-dim); text-decoration:none; padding:6px 12px; border-top:1px solid var(--border); margin:0 -12px -12px; transition:color .15s,background .15s; }
  .yt-link:hover:not(.off) { color:var(--text-muted); background:var(--surface2); }
  .yt-link.off { pointer-events:none; opacity:.25; }
  .yt-link svg { width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:2; }

  footer { text-align:center; padding:14px; font-family:var(--mono); font-size:10px; color:var(--text-dim); border-top:1px solid var(--border); letter-spacing:.06em; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">
    <div class="loading-logo-icon">
      <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="10" rx="1.5"/><path d="M5 12v2M11 12v2M3 14h10"/></svg>
    </div>
    <div>
      <div class="loading-title">Centro de Mídias</div>
      <div class="loading-sub">Monitor de lives</div>
    </div>
  </div>
  <div class="loading-bar"><div class="loading-bar-fill" id="loadBar"></div></div>
  <div class="loading-msg" id="loadMsg">Buscando transmissões ao vivo...</div>
  <div class="loading-error" id="loadError">
    <span id="loadErrorMsg"></span><br>
    <button class="btn-retry" onclick="iniciar()">Tentar novamente</button>
  </div>
</div>

<div id="monitor-screen">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="10" rx="1.5"/><path d="M5 12v2M11 12v2M3 14h10"/></svg>
      </div>
      <div>
        <div class="logo-text">Centro de Mídias</div>
        <div class="logo-sub">Monitor de lives</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-pill"><div class="live-dot"></div>AO VIVO</div>
      <div class="clock" id="clock">--:--:--</div>
      <button class="btn-hdr amber" id="btnTodos" onclick="toggleTodos()">
        <svg viewBox="0 0 24 24"><path d="M15.536 8.464a5 5 0 010 7.072M12 6a7 7 0 010 12"/><circle cx="9" cy="12" r="2"/></svg>
        Ouvir todos
      </button>
      <button class="btn-hdr" id="btnRefresh" onclick="atualizarLives()">
        <svg viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4.07 15a8 8 0 1 0 .29-4.88"/></svg>
        Atualizar
      </button>
    </div>
  </header>

  <div class="turno-bar">
    <span class="turno-label">Turno</span>
    <button class="t-tab active" onclick="setTurno(this,'Matutino')">Matutino</button>
    <button class="t-tab" onclick="setTurno(this,'Vespertino')">Vespertino</button>
    <button class="t-tab" onclick="setTurno(this,'Noturno')">Noturno</button>
  </div>

  <div class="status-bar">
    <div class="status-left"><div class="status-dot"></div><span id="statusText">—</span></div>
    <div class="status-right" id="statusRight"></div>
  </div>

  <div class="grid" id="grid"></div>
  <footer>Centro de Mídias — Monitor de transmissões ao vivo &nbsp;|&nbsp; API v3 · 3 chaves em rodízio</footer>
</div>

<script>
// ═══════════════════════════════════════
// CONFIGURAÇÃO
// ═══════════════════════════════════════
const API_KEYS = [
  'AIzaSyCe3wlSYD6SUiekWxkeIi1671DQF8lUxcI',
  'AIzaSyAT0YcuBbmENdFtd2bW7jfxKb5DEkFjCLs',
  'AIzaSyDf-YvG0LnOMK8f-TqU8yhvRNXg2LSJTAw',
];
let keyIdx = 0;

const CHANNELS = [
  { id:'ch1', label:'8º Ano',   cid:'UCB0MTJaJAkX4cKC9vhcFNvw' },
  { id:'ch2', label:'9º Ano',   cid:'UCJim7HUhrxwZTP_7zCDUWeg' },
  { id:'ch3', label:'1ª Série', cid:'UC0xLE2oM2iDiWhDsep8Iu-A' },
  { id:'ch4', label:'2ª Série', cid:'UCM5U9EpaRFrJh5Wt3dXggKg' },
  { id:'ch5', label:'3ª Série', cid:'UC3MKYCEnPR1NDayp7TQwMmg' },
];

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let turnoAtivo = 'Matutino';
let ouvidoId   = null;
let todosAtivo = false;
const dados    = {}; // chId -> { videoId, title, type }

// ═══════════════════════════════════════
// SVGs
// ═══════════════════════════════════════
const I = {
  ouvir: `<svg viewBox="0 0 24 24"><path d="M15.536 8.464a5 5 0 010 7.072M12 6a7 7 0 010 12"/><circle cx="9" cy="12" r="2"/></svg>`,
  mudo:  `<svg viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/><path d="M17 3l4 4-8 8H9v-4L17 3z"/></svg>`,
  ext:   `<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>`,
  off:   `<svg viewBox="0 0 24 24"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>`,
  spin:  `<svg viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4.07 15a8 8 0 1 0 .29-4.88"/></svg>`,
};

// ═══════════════════════════════════════
// URL do iframe
// ═══════════════════════════════════════
function iframeSrc(videoId, muted) {
  const m = muted ? '&mute=1' : '';
  return `https://www.youtube.com/embed/${videoId}?autoplay=1${m}&rel=0&modestbranding=1&playsinline=1`;
}

// ═══════════════════════════════════════
// API YouTube Data v3 com rodízio
// ═══════════════════════════════════════
async function apiSearch(channelId, eventType) {
  for (let t = 0; t < API_KEYS.length; t++) {
    const key = API_KEYS[keyIdx % API_KEYS.length];
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&eventType=${eventType}&type=video&maxResults=1&key=${key}`;
    try {
      const res  = await fetch(url);
      const data = await res.json();
      if (data.error) {
        if (data.error.code === 403) { keyIdx++; continue; }
        return null;
      }
      if (data.items?.length) {
        return { videoId: data.items[0].id.videoId, title: data.items[0].snippet.title };
      }
      return null;
    } catch(e) { return null; }
  }
  return null;
}

async function buscarCanal(ch) {
  const [live, upcoming] = await Promise.all([
    apiSearch(ch.cid, 'live'),
    apiSearch(ch.cid, 'upcoming'),
  ]);
  if (live?.videoId)     return { videoId: live.videoId,     title: live.title,     type: 'live' };
  if (upcoming?.videoId) return { videoId: upcoming.videoId, title: upcoming.title, type: 'upcoming' };
  return { videoId: null, title: '', type: null };
}

async function buscarTodos() {
  const res = await Promise.all(CHANNELS.map(ch => buscarCanal(ch)));
  CHANNELS.forEach((ch, i) => { dados[ch.id] = res[i]; });
}

// ═══════════════════════════════════════
// Inicialização
// ═══════════════════════════════════════
window.addEventListener('DOMContentLoaded', iniciar);

async function iniciar() {
  document.getElementById('loadError').style.display = 'none';
  document.getElementById('loadMsg').style.display   = 'block';
  setProgress(20);
  try {
    await buscarTodos();
    setProgress(100);
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('monitor-screen').style.display = 'block';
      renderGrid();
      atualizarStatus();
    }, 250);
  } catch(e) {
    document.getElementById('loadMsg').style.display = 'none';
    document.getElementById('loadErrorMsg').textContent = 'Erro ao buscar transmissões: ' + e.message;
    document.getElementById('loadError').style.display = 'block';
  }
}

async function atualizarLives() {
  const btn = document.getElementById('btnRefresh');
  if (btn) { btn.disabled = true; btn.innerHTML = I.spin + ' Buscando...'; }
  ouvidoId = null; todosAtivo = false;
  const btnT = document.getElementById('btnTodos');
  if (btnT) { btnT.classList.remove('ativo'); btnT.innerHTML = I.ouvir + ' Ouvir todos'; }
  try {
    await buscarTodos();
    renderGrid();
    atualizarStatus();
  } catch(e) { setStatus('Erro ao atualizar. Tente novamente.'); }
  if (btn) { btn.disabled = false; btn.innerHTML = I.spin + ' Atualizar'; }
}

// ═══════════════════════════════════════
// Renderização
// ═══════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ouvidoId = null; todosAtivo = false;

  CHANNELS.forEach(ch => {
    const d    = dados[ch.id] || {};
    const vid  = d.videoId;
    const type = d.type;
    const ttl  = d.title || '';
    const segs = Array.from({length:10},(_,i)=>`<div class="vol-seg" id="seg-${ch.id}-${i}"></div>`).join('');

    const card = document.createElement('div');
    card.className = 'channel-card';
    card.id = 'card-' + ch.id;

    card.innerHTML = `
      <div class="player-wrapper" id="wrap-${ch.id}">
        ${vid
          ? `<iframe id="iframe-${ch.id}"
               src="${iframeSrc(vid, true)}"
               allow="autoplay; encrypted-media; picture-in-picture"
               allowfullscreen
               ></iframe>
             <div id="cover-${ch.id}" style="position:absolute;inset:0;background:#0d0f11;z-index:4;transition:opacity 0.8s ease;pointer-events:none;display:flex;align-items:center;justify-content:center;">
               <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1d9e75" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg>
             </div>`
          : `<div class="ph" id="ph-${ch.id}">${I.off}<span>SEM TRANSMISSÃO</span></div>`
        }
        <div class="player-overlay"></div>
        <div class="badge badge-live" id="blive-${ch.id}" style="${type==='live'?'display:flex':''}">
          <span class="dot"></span> LIVE
        </div>
        <div class="badge badge-upcoming" id="bup-${ch.id}" style="${type==='upcoming'?'display:flex':''}">
          ⏰ AGENDADO
        </div>
        <div class="badge-muted" id="bmuted-${ch.id}" style="${!vid?'display:none':''}">MUDO</div>
      </div>
      <div class="card-info">
        <div class="card-header">
          <div class="card-title">${ch.label}</div>
          <div class="card-shift">${turnoAtivo}</div>
        </div>
        ${ttl ? `<div class="card-vtitle" title="${ttl}">${ttl}</div>` : ''}
        <div class="vol-bar"><div class="vol-label">VOL</div><div class="vol-segs">${segs}</div></div>
        <button class="btn-listen" id="btn-${ch.id}" onclick="ouvirCanal('${ch.id}')" ${!vid?'disabled':''}>
          ${vid ? I.mudo+' Ouvir' : I.off+' Sem transmissão'}
        </button>
        <a class="yt-link ${!vid?'off':''}" href="${vid?'https://www.youtube.com/watch?v='+vid:'#'}" target="_blank">
          ${I.ext} Abrir no YouTube
        </a>
      </div>`;

    grid.appendChild(card);
  });

  // Remove as capas após 4s — tempo suficiente para o YouTube iniciar o vídeo
  setTimeout(() => {
    CHANNELS.forEach(ch => {
      const cover = document.getElementById('cover-' + ch.id);
      if (cover) {
        cover.style.opacity = '0';
        setTimeout(() => { if (cover.parentNode) cover.remove(); }, 800);
      }
    });
  }, 4000);
}

// ═══════════════════════════════════════
// Controle de áudio via src do iframe
// ═══════════════════════════════════════
function ouvirCanal(id) {
  if (!dados[id]?.videoId) return;

  // Desativa "ouvir todos" se estiver ativo
  if (todosAtivo) {
    todosAtivo = false;
    const btnT = document.getElementById('btnTodos');
    if (btnT) { btnT.classList.remove('ativo'); btnT.innerHTML = I.ouvir + ' Ouvir todos'; }
  }

  const anterior = ouvidoId;
  ouvidoId = (ouvidoId === id) ? null : id;

  CHANNELS.forEach(ch => {
    if (!dados[ch.id]?.videoId) return;
    const ouvindo = ch.id === ouvidoId;

    // Só recarrega o iframe se mudou o estado de mute desse canal
    const mudou = (ch.id === id) || (ch.id === anterior);
    if (mudou) {
      const iframe = document.getElementById('iframe-' + ch.id);
      if (iframe) iframe.src = iframeSrc(dados[ch.id].videoId, !ouvindo);
    }

    atualizarVisual(ch.id, ouvindo ? 'single' : null);
  });

  const ch = ouvidoId ? CHANNELS.find(c => c.id === ouvidoId) : null;
  setStatus(ch
    ? `▶ Ouvindo: ${ch.label} — ${turnoAtivo}. Os outros ${CHANNELS.length-1} canais com vídeo ativo e áudio mudo.`
    : 'Clique em "Ouvir" para monitorar o áudio. Os demais ficam mutados automaticamente.');
}

function toggleTodos() {
  todosAtivo ? desativarTodos() : ativarTodos();
}

function ativarTodos() {
  todosAtivo = true; ouvidoId = null;
  const btn = document.getElementById('btnTodos');
  if (btn) { btn.classList.add('ativo'); btn.innerHTML = I.ouvir + ' Parar todos'; }

  CHANNELS.forEach(ch => {
    if (!dados[ch.id]?.videoId) return;
    const iframe = document.getElementById('iframe-' + ch.id);
    if (iframe) iframe.src = iframeSrc(dados[ch.id].videoId, false);
    atualizarVisual(ch.id, 'all');
  });

  setStatus('▶ Ouvindo todos os canais simultaneamente — use para comparar volumes.');
}

function desativarTodos() {
  todosAtivo = false;
  const btn = document.getElementById('btnTodos');
  if (btn) { btn.classList.remove('ativo'); btn.innerHTML = I.ouvir + ' Ouvir todos'; }

  CHANNELS.forEach(ch => {
    if (!dados[ch.id]?.videoId) return;
    const iframe = document.getElementById('iframe-' + ch.id);
    if (iframe) iframe.src = iframeSrc(dados[ch.id].videoId, true);
    atualizarVisual(ch.id, null);
  });

  setStatus('Clique em "Ouvir" para monitorar o áudio. Os demais ficam mutados automaticamente.');
}

function atualizarVisual(chId, modo) {
  const card = document.getElementById('card-' + chId);
  const btn  = document.getElementById('btn-'  + chId);
  if (!card || !btn) return;

  card.classList.remove('listening', 'listen-all');
  btn.classList.remove('s-active', 'a-active');

  if (modo === 'single') {
    card.classList.add('listening');
    btn.className = 'btn-listen s-active';
    btn.innerHTML = I.ouvir + ' Ouvindo';
  } else if (modo === 'all') {
    card.classList.add('listen-all');
    btn.className = 'btn-listen a-active';
    btn.innerHTML = I.ouvir + ' Ouvindo';
  } else {
    btn.className = 'btn-listen';
    btn.innerHTML = I.mudo + ' Ouvir';
  }

  const on = (modo === 'single' || modo === 'all');
  for (let i = 0; i < 10; i++) {
    const s = document.getElementById(`seg-${chId}-${i}`);
    if (s) s.classList.toggle('on', on && i < 8);
  }
}

// ═══════════════════════════════════════
// UI helpers
// ═══════════════════════════════════════
function setStatus(msg) {
  const el = document.getElementById('statusText');
  if (el) el.textContent = msg;
}

function atualizarStatus() {
  const vivos     = CHANNELS.filter(ch => dados[ch.id]?.type === 'live').length;
  const agendados = CHANNELS.filter(ch => dados[ch.id]?.type === 'upcoming').length;
  const agora     = new Date().toLocaleTimeString('pt-BR');
  let partes = [];
  if (vivos)     partes.push(`${vivos} ao vivo`);
  if (agendados) partes.push(`${agendados} agendado${agendados>1?'s':''}`);
  if (!partes.length) partes.push('nenhuma transmissão');
  document.getElementById('statusRight').textContent = `${agora} · ${partes.join(' · ')}`;
  setStatus(vivos+agendados === 0
    ? 'Nenhuma transmissão encontrada. Clique em "Atualizar" quando as lives iniciarem.'
    : `${vivos+agendados} de ${CHANNELS.length} canais com transmissão. Clique em "Ouvir" para monitorar.`);
}

function setProgress(p) {
  const el = document.getElementById('loadBar');
  if (el) el.style.width = p + '%';
}

function setTurno(btn, nome) {
  turnoAtivo = nome;
  document.querySelectorAll('.t-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card-shift').forEach(el => el.textContent = nome);
}

// Relógio
setInterval(() => {
  const el = document.getElementById('clock');
  if (!el) return;
  const n = new Date();
  el.textContent = [n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
}, 1000);
</script>

<style>
  :root {
    --bg:#0d0f11;--surface:#141618;--surface2:#1c1f22;
    --border:rgba(255,255,255,0.08);
    --accent:#1d9e75;--accent-dim:rgba(29,158,117,0.12);--accent-glow:rgba(29,158,117,0.22);
    --red:#e24b4a;--amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);
    --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
    --text:#e8e8e6;--text-muted:#6b6f72;--text-dim:#3a3d40;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px)}

  /* LOADING */
  #loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  .ll{display:flex;align-items:center;gap:12px}
  .ll img{width:44px;height:44px;object-fit:contain}
  .ll-t{font-family:var(--mono);font-size:14px;letter-spacing:.04em}
  .ll-s{font-family:var(--mono);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
  .lbar{width:240px;height:2px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .lbar-f{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .5s ease}
  .lmsg{font-family:var(--mono);font-size:12px;color:var(--text-muted);letter-spacing:.06em;animation:blink 1.2s infinite}
  .lerr{font-family:var(--mono);font-size:12px;color:var(--red);text-align:center;max-width:420px;line-height:1.8;display:none;padding:0 20px}
  .btn-retry{margin-top:14px;background:transparent;border:1px solid var(--red);color:var(--red);font-family:var(--mono);font-size:11px;padding:7px 20px;border-radius:5px;cursor:pointer}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* HEADER */
  #monitor-screen{display:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:8px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo img{width:34px;height:34px;object-fit:contain}
  .logo-t{font-family:var(--mono);font-size:13px;letter-spacing:.04em;font-weight:500}
  .logo-s{font-size:10px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
  .hdr-r{display:flex;align-items:center;gap:8px}
  .live-pill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--red);letter-spacing:.1em}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
  .clock{font-family:var(--mono);font-size:14px;color:var(--text-muted);letter-spacing:.05em;min-width:68px}
  .btn-hdr{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--border);border-radius:4px;padding:5px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--text-dim)}
  .btn-hdr svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex-shrink:0}
  .btn-hdr:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
  .btn-hdr:disabled{opacity:.35;cursor:not-allowed}
  .btn-hdr.red{border-color:rgba(226,75,74,.4);color:var(--red)}
  .btn-hdr.red:hover{background:rgba(226,75,74,.1);border-color:var(--red)}
  .btn-hdr.red.ativo{background:rgba(226,75,74,.15);border-color:var(--red);color:var(--red)}
  .turno-badge{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:3px 10px;letter-spacing:.08em;text-transform:uppercase}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 20px 20px}
  @media(max-width:1300px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}

  /* CARD */
  .channel-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s}
  .channel-card.listening{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow),0 0 20px var(--accent-glow)}

  /* PLAYER */
  .player-wrapper{position:relative;width:100%;padding-top:56.25%;background:#000;overflow:hidden}
  .iframe-main{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:1}
  .player-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,0.55) 100%);pointer-events:none;z-index:3}
  .player-cover{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease;pointer-events:none}
  .player-cover svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#080a0b;z-index:1}
  .ph svg{width:26px;height:26px;fill:none;stroke:var(--text-dim);stroke-width:1.5;stroke-linecap:round}
  .ph span{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:.06em}

  /* BADGES */
  .badge{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:3px;display:none;align-items:center;gap:5px;pointer-events:none;z-index:4;top:8px;left:8px}
  .badge-live{background:var(--red);color:#fff}
  .badge-upcoming{background:var(--amber);color:#000;font-weight:500}
  .badge-live .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
  .badge-muted{position:absolute;top:8px;right:36px;background:rgba(0,0,0,.7);color:var(--text-muted);font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;pointer-events:none;z-index:4;transition:opacity .2s}
  .channel-card.listening .badge-muted{opacity:0}

  /* REFRESH BTN */
  .btn-card-refresh{position:absolute;bottom:8px;right:8px;z-index:4;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
  .btn-card-refresh:hover{background:rgba(29,158,117,.3);border-color:var(--accent)}
  .btn-card-refresh svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
  .btn-card-refresh.loading svg{animation:spin 1s linear infinite}

  /* CARD INFO */
  .card-info{padding:10px 12px 0;display:flex;flex-direction:column;gap:0;flex:1}

  .card-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
  .estudio-label{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
  .serie-label{font-size:14px;font-weight:500}

  /* AULA ATUAL */
  .aula-atual{background:var(--surface2);border-radius:6px;padding:8px 10px;margin-bottom:8px}
  .aula-disc{font-size:13px;font-weight:500;color:var(--text);line-height:1.2}
  .aula-prof{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:2px}
  .aula-empty{font-family:var(--mono);font-size:10px;color:var(--text-dim);font-style:italic}

  /* TÉCNICOS */
  .tecnicos{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .tec-icon{width:14px;height:14px;fill:none;stroke:var(--text-dim);stroke-width:2;stroke-linecap:round;flex-shrink:0}
  .tec-names{font-family:var(--mono);font-size:10px;color:var(--text-muted)}

  /* GRADE */
  .grade-list{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
  .grade-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;transition:background .15s}
  .grade-item.agora{background:rgba(29,158,117,.1);border-left:2px solid var(--accent)}
  .grade-item.proxima{background:rgba(245,158,11,.06);border-left:2px solid var(--amber)}
  .grade-item.encerrada{opacity:.4}
  .gi-hora{font-family:var(--mono);font-size:9px;color:var(--text-dim);width:36px;flex-shrink:0}
  .gi-disc{font-size:11px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gi-status{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .gi-status.live{background:var(--red)}
  .gi-status.prox{background:var(--amber)}
  .gi-status.enc{background:var(--text-dim)}
  .gi-status.fut{background:transparent;border:1px solid var(--text-dim)}

  /* CONTROLES */
  .card-controls{display:flex;gap:6px;padding:0 0 10px}
  .btn-listen{flex:1;padding:7px 0;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:var(--mono);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;letter-spacing:.04em}
  .btn-listen:hover:not(:disabled){background:var(--surface2);color:var(--text)}
  .btn-listen.ativo{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:500}
  .btn-listen:disabled{opacity:.3;cursor:not-allowed}
  .btn-listen svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  .yt-link{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--text-dim);text-decoration:none;padding:6px 12px;border-top:1px solid var(--border);margin:0 -12px;transition:color .15s,background .15s}
  .yt-link:hover:not(.off){color:var(--text-muted);background:var(--surface2)}
  .yt-link.off{pointer-events:none;opacity:.25}
  .yt-link svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2}

  footer{text-align:center;padding:12px;font-family:var(--mono);font-size:10px;color:var(--text-dim);border-top:1px solid var(--border);letter-spacing:.06em}
</style>
</head>

// Detecta turno atual
function getTurnoAtual() {
  const h = new Date().getHours() + new Date().getMinutes()/60;
  if (h >= 7 && h < 12) return 'mat';
  if (h >= 13 && h < 18) return 'vesp';
  if (h >= 18 && h < 23.5) return 'not';
  return 'not';
}

function getTurnoLabel(t) {

}

function getDiaAtual() {

}

// Retorna aula atual e próxima baseado no horário
function getAulaAtual(serie, turno, dia) {
  const g = GRADE[serie]?.[turno]?.[dia];
  if (!g) return {atual:null, proxima:null, todas:[], aulaIdx:-1};
  const agora = new Date();
  const hAtual = agora.getHours() * 60 + agora.getMinutes();
  const hs = TURNO_HORARIOS[turno] || [];
  let aulaIdx = -1;
  for (let i = 0; i < hs.length; i++) {
    const [ini, fim] = hs[i];
    const [hI, mI] = ini.split(':').map(Number);
    const [hF, mF] = fim.split(':').map(Number);
    if (hAtual >= hI*60+mI && hAtual < hF*60+mF) {
      aulaIdx = i; break;
    }
  }
  const atual = aulaIdx >= 0 ? g[aulaIdx] : null;
  const proxima = aulaIdx >= 0 && aulaIdx+1 < g.length ? g[aulaIdx+1] :
                  aulaIdx < 0 && hAtual < 7*60 ? g[0] : null;
  return {atual, proxima, todas:g, aulaIdx};
}

  ref:   `<svg viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4.07 15a8 8 0 1 0 .29-4.88"/></svg>`,
  tec:   `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
};

function srcMudo(vid) { return `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1`; }
function srcAudio(vid) { return `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1&playsinline=1`; }

// API
async function apiCall(endpoint) {
  const ts = Date.now();
  for (let t = 0; t < API_KEYS.length; t++) {
    const key = API_KEYS[keyIdx % API_KEYS.length];
    try {
      const res = await fetch(`${endpoint}&key=${key}&_=${ts}`, {cache:'no-store'});
      const d = await res.json();
      if (d.error) { if (d.error.code === 403) { keyIdx++; continue; } return null; }
      return d;
    } catch(e) { return null; }
  }
  return null;
}

async function buscarLive(cid) {
  const d = await apiCall(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${cid}&eventType=live&type=video&maxResults=1`);
  if (!d?.items?.length) return null;
  return {videoId:d.items[0].id.videoId, title:d.items[0].snippet.title, type:'live'};
}

async function buscarProximaAgendada(cid) {
  const d = await apiCall(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${cid}&eventType=upcoming&type=video&maxResults=25&order=date`);
  if (!d?.items?.length) return null;
  const agora = Date.now();
  const ids = d.items.map(i => i.id.videoId).join(',');
  const det = await apiCall(`https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${ids}`);
  if (!det?.items?.length) return null;
  const lista = det.items.map(item => {
    const sc = item.liveStreamingDetails?.scheduledStartTime;
    if (!sc) return null;
    if (item.liveStreamingDetails?.actualEndTime) return null;
    if (item.snippet?.liveBroadcastContent === 'live') return null;
    const ms = new Date(sc).getTime();
    if (ms < agora - 10*60*1000) return null;
    return {videoId:item.id, title:item.snippet.title, scheduled:ms, type:'upcoming'};
  }).filter(Boolean).sort((a,b)=>a.scheduled-b.scheduled);
  return lista[0] || null;
}

async function buscarCanal(ch) {
  const live = await buscarLive(ch.cid);
  if (live) return live;
  const up = await buscarProximaAgendada(ch.cid);
  if (up) return up;
  return {videoId:null, title:'', type:null};
}

async function buscarTodos() {
  const res = await Promise.all(CHANNELS.map(ch => buscarCanal(ch)));
  CHANNELS.forEach((ch,i) => { dados[ch.id] = res[i]; });
}

// Init
window.addEventListener('DOMContentLoaded', iniciar);

async function iniciar() {
  document.getElementById('loadError').style.display = 'none';
  document.getElementById('loadMsg').style.display = 'block';
  setProgress(20);
  try {
    await buscarTodos();
    setProgress(100);
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('monitor-screen').style.display = 'block';
      atualizarTurnoBadge();
      renderGrid();
    }, 250);
  } catch(e) {
    document.getElementById('loadMsg').style.display = 'none';
    document.getElementById('loadErrorMsg').textContent = 'Erro: ' + e.message;
    document.getElementById('loadError').style.display = 'block';
  }
}

async function atualizarTodos() {
  const btn = document.getElementById('btnRefresh');
  if (btn) { btn.disabled = true; btn.innerHTML = I.spin + ' Buscando...'; }
  CHANNELS.forEach(ch => desativarAudio(ch.id));
  try {
    await buscarTodos();
    renderGrid();
  } catch(e) {}
  if (btn) { btn.disabled = false; btn.innerHTML = I.ref + ' Atualizar'; }
}

async function atualizarCard(chId) {
  const btn = document.getElementById('crefresh-' + chId);
  if (btn) btn.classList.add('loading');
  const ch = CHANNELS.find(c => c.id === chId);
  if (ch) {
    dados[chId] = await buscarCanal(ch);
    rebuiltCard(ch);
  }
  if (btn) btn.classList.remove('loading');
}

// Mutar todos
function mutarTodos() {
  const btn = document.getElementById('btnMutar');
  const algumAtivo = Object.values(audioAtivo).some(v => v);
  if (algumAtivo) {
    CHANNELS.forEach(ch => { desativarAudio(ch.id); });
    if (btn) { btn.classList.remove('ativo'); btn.innerHTML = I.mudo + ' Mutar todos'; }
  }
}

// Render
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  CHANNELS.forEach(ch => buildCard(ch));
  setTimeout(() => CHANNELS.forEach(ch => removerCover(ch.id)), 4000);
  // Atualiza grade a cada minuto
  setTimeout(atualizarGrades, 60000);
}

function atualizarGrades() {
  CHANNELS.forEach(ch => {
    atualizarInfoCard(ch);
  });
  setTimeout(atualizarGrades, 60000);
}

function buildCard(ch) {
  const grid = document.getElementById('grid');
  const card = document.createElement('div');
  card.className = 'channel-card';
  card.id = 'card-' + ch.id;
  grid.appendChild(card);
  rebuiltCard(ch);
}

function rebuiltCard(ch) {
  const card = document.getElementById('card-' + ch.id);
  if (!card) return;
  const d = dados[ch.id] || {};
  const vid = d.videoId;
  const type = d.type;
  const tec = TECNICOS[ch.label] || {};
  const turno = getTurnoAtual();
  const dia = getDiaAtual();
  const tecAtual = tec[turno] || [];
  const {atual, proxima, todas, aulaIdx} = getAulaAtual(ch.label, turno, dia);
  const isOuvindo = audioAtivo[ch.id] || false;

  // Grade HTML
  const gradeHtml = todas.map((aula, i) => {
    let cls = 'grade-item';
    let statusCls = 'fut';
    if (i === aulaIdx) { cls += ' agora'; statusCls = 'live'; }
    else if (i === aulaIdx + 1) { cls += ' proxima'; statusCls = 'prox'; }
    else if (i < aulaIdx) { cls += ' encerrada'; statusCls = 'enc'; }
    return `<div class="${cls}">
      <span class="gi-hora">${aula.horario}</span>
      <span class="gi-disc">${aula.label || aula.disc}</span>
      <span class="gi-status ${statusCls}"></span>
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="player-wrapper" id="wrap-${ch.id}">
      ${vid ? `
        <iframe class="iframe-main" id="main-${ch.id}"
          src="${srcMudo(vid)}"
          allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        <div id="audio-slot-${ch.id}" style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
        <div class="player-cover" id="cover-${ch.id}">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg>
        </div>
      ` : `<div class="ph">${I.off}<span>SEM TRANSMISSÃO</span></div>`}
      <div class="player-overlay"></div>
      <div class="badge badge-live" id="blive-${ch.id}" style="${type==='live'?'display:flex':''}">
        <span class="dot"></span> LIVE
      </div>
      <div class="badge badge-upcoming" id="bup-${ch.id}" style="${type==='upcoming'?'display:flex':''}">
        ⏰ AGENDADO
      </div>
      <div class="badge-muted" id="bmuted-${ch.id}" style="${!vid?'display:none':''}">MUDO</div>
      <button class="btn-card-refresh" id="crefresh-${ch.id}" onclick="atualizarCard('${ch.id}')" title="Atualizar">
        ${I.ref}
      </button>
    </div>
    <div class="card-info">
      <div class="card-top">
        <span class="estudio-label">${tec.estudio || ''}</span>
        <span class="serie-label">${ch.label}</span>
      </div>
      <div class="aula-atual" id="aula-atual-${ch.id}">
        ${atual
          ? `<div class="aula-disc">${atual.label || atual.disc}</div>
             <div class="aula-prof">${atual.prof ? '👤 ' + atual.prof : ''}</div>`
          : proxima
            ? `<div class="aula-disc" style="color:var(--amber)">Próxima: ${proxima.horario} — ${proxima.label || proxima.disc}</div>
               <div class="aula-prof">${proxima.prof ? '👤 ' + proxima.prof : ''}</div>`
            : `<div class="aula-empty">Sem aula no momento</div>`
        }
      </div>
      <div class="tecnicos">
        <svg class="tec-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span class="tec-names">${tecAtual.join(' · ') || '—'}</span>
      </div>
      <div class="grade-list">${gradeHtml}</div>
      <div class="card-controls">
        <button class="btn-listen ${isOuvindo?'ativo':''}" id="btn-${ch.id}" onclick="toggleOuvir('${ch.id}')" ${!vid?'disabled':''}>
          ${isOuvindo ? I.ouvir + ' Ouvindo' : I.mudo + ' Ouvir'}
        </button>
      </div>
      <a class="yt-link ${!vid?'off':''}" id="ytlink-${ch.id}" href="${vid?'https://www.youtube.com/watch?v='+vid:'#'}" target="_blank">
        ${I.ext} Abrir no YouTube
      </a>
    </div>`;

  if (isOuvindo) card.classList.add('listening');
  else card.classList.remove('listening');
}

function atualizarInfoCard(ch) {
  const turno = getTurnoAtual();
  const dia = getDiaAtual();
  const {atual, proxima, todas, aulaIdx} = getAulaAtual(ch.label, turno, dia);

  // Atualiza aula atual
  const aulaEl = document.getElementById('aula-atual-' + ch.id);
  if (aulaEl) {
    if (atual) {
      aulaEl.innerHTML = `<div class="aula-disc">${atual.label || atual.disc}</div>
        <div class="aula-prof">${atual.prof ? '👤 ' + atual.prof : ''}</div>`;
    } else if (proxima) {
      aulaEl.innerHTML = `<div class="aula-disc" style="color:var(--amber)">Próxima: ${proxima.horario} — ${proxima.label || proxima.disc}</div>
        <div class="aula-prof">${proxima.prof ? '👤 ' + proxima.prof : ''}</div>`;
    } else {
      aulaEl.innerHTML = `<div class="aula-empty">Sem aula no momento</div>`;
    }
  }
  atualizarTurnoBadge();
}

function atualizarTurnoBadge() {
  const el = document.getElementById('turnoBadge');
  if (el) el.textContent = getTurnoLabel(getTurnoAtual());
}

// Áudio — toggle independente por canal
function toggleOuvir(id) {
  if (!dados[id]?.videoId) return;
  if (audioAtivo[id]) {
    desativarAudio(id);
  } else {
    ativarAudio(id);
  }
}

function ativarAudio(chId) {
  const vid = dados[chId]?.videoId;
  const slot = document.getElementById('audio-slot-' + chId);
  if (!vid || !slot) return;
  if (document.getElementById('audio-' + chId)) return;
  const iframe = document.createElement('iframe');
  iframe.id = 'audio-' + chId;
  iframe.src = srcAudio(vid);
  iframe.allow = 'autoplay; encrypted-media';
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;';
  slot.appendChild(iframe);
  audioAtivo[chId] = true;
  const card = document.getElementById('card-' + chId);
  const btn = document.getElementById('btn-' + chId);
  const bmut = document.getElementById('bmuted-' + chId);
  if (card) card.classList.add('listening');
  if (btn) { btn.className = 'btn-listen ativo'; btn.innerHTML = I.ouvir + ' Ouvindo'; }
  if (bmut) bmut.style.opacity = '0';
}

function desativarAudio(chId) {
  const el = document.getElementById('audio-' + chId);
  if (el) el.remove();
  audioAtivo[chId] = false;
  const card = document.getElementById('card-' + chId);
  const btn = document.getElementById('btn-' + chId);
  const bmut = document.getElementById('bmuted-' + chId);
  if (card) card.classList.remove('listening');
  if (btn && !btn.disabled) { btn.className = 'btn-listen'; btn.innerHTML = I.mudo + ' Ouvir'; }
  if (bmut) bmut.style.opacity = '';
}

function removerCover(chId) {
  const c = document.getElementById('cover-' + chId);
  if (c) { c.style.opacity = '0'; setTimeout(() => { if (c.parentNode) c.remove(); }, 800); }
}

function setProgress(p) {
  const el = document.getElementById('loadBar');
  if (el) el.style.width = p + '%';
}

// Relógio
setInterval(() => {
  const el = document.getElementById('clock');
  if (!el) return;
  const n = new Date();
  el.textContent = [n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
}, 1000);
</script>
